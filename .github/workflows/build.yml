name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Verify tool count did not collapse
        run: |
          COUNT=$(grep -rhoF "defineTool(" src/tools | wc -l | tr -d ' ')
          echo "defineTool calls: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::tool count dropped to $COUNT"
            exit 1
          fi

      - name: Verify generated docs are current
        run: npm run check-docs

      - name: Verify skill files
        run: npm run check-skill

      - name: Verify key tools exist
        run: |
          for t in browser_pick_color_at browser_drag_html5 browser_navigate browser_screenshot; do
            if ! grep -rqF "$t" src/tools; then
              echo "::error::missing tool $t"
              exit 1
            fi
          done
          echo "all key tools present"
